<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <title>Sketch from inside an off-road car: a tilted view of mountains through the windscreen, and the side mirror showing one tyre up on the rocks</title>
  <defs>
    <clipPath id="screen"><path d="M86 66 C150 56 290 56 354 66 L382 258 C280 248 172 248 68 258 Z"/></clipPath>
    <clipPath id="mirror"><rect x="6" y="158" width="58" height="44" rx="12"/></clipPath>
  </defs>
  <!-- Outside world, tilted because the left tyre is up on a rock -->
  <g clip-path="url(#screen)">
    <g transform="rotate(-8 220 170)">
      <path d="M40 176 L104 116 L138 146 L186 90 L232 138 L270 106 L330 160 L420 140" />
      <path d="M160 118 L176 128 L186 114 M256 120 L270 128 M110 124 L122 132" stroke-width="1.4" opacity=".7"/>
      <path d="M40 196 C120 186 300 184 420 192" stroke-width="1.4" opacity=".55"/>
      <path d="M150 280 C182 238 202 210 208 186"/>
      <path d="M300 280 C262 238 228 210 220 186"/>
      <path d="M186 262 C194 246 200 234 206 214 M262 262 C246 246 232 232 224 214" stroke-width="1.4" opacity=".5"/>
      <path d="M86 254 C90 236 110 228 126 238 C136 244 136 254 130 260 Z"/>
      <path d="M316 236 C324 220 346 222 352 236 C354 246 346 252 336 252 Z"/>
      <path d="M100 246 L112 240 M330 232 L340 238" stroke-width="1.3" opacity=".6"/>
    </g>
  </g>
  <!-- Windscreen frame and pillars -->
  <path d="M86 66 C150 56 290 56 354 66 L382 258 C280 248 172 248 68 258 Z"/>
  <path d="M76 70 L58 262 M364 70 L392 262" stroke-width="1.6" opacity=".7"/>
  <!-- Rear-view mirror -->
  <path d="M220 60 L220 74"/>
  <rect x="190" y="74" width="60" height="18" rx="8"/>
  <!-- Side mirror: the tyre climbing a rock -->
  <path d="M64 184 L74 192"/>
  <rect x="6" y="158" width="58" height="44" rx="12"/>
  <g clip-path="url(#mirror)" stroke-width="1.8">
    <path d="M6 200 C16 188 26 184 38 190 C48 194 58 192 66 186" />
    <circle cx="36" cy="176" r="13"/>
    <circle cx="36" cy="176" r="6" stroke-width="1.4"/>
    <path d="M23 170 L19 168 M24 184 L20 187 M36 163 L36 159 M48 170 L52 168" stroke-width="1.4"/>
  </g>
  <!-- Dashboard -->
  <path d="M0 286 C120 266 280 266 400 286"/>
  <path d="M0 302 C120 284 280 284 400 302" stroke-width="1.4" opacity=".6"/>
  <!-- Steering wheel -->
  <ellipse cx="150" cy="354" rx="84" ry="54"/>
  <ellipse cx="150" cy="354" rx="68" ry="40" stroke-width="1.6"/>
  <ellipse cx="150" cy="362" rx="20" ry="14"/>
  <path d="M82 354 C104 354 122 358 130 362 M218 354 C196 354 178 358 170 362 M150 376 L150 406"/>
  <!-- Small roll gauge on the dash, showing the tilt -->
  <circle cx="306" cy="318" r="18" stroke-width="1.6"/>
  <path d="M290 322 L322 312" stroke-width="1.6"/>
  <path d="M306 300 L306 305" stroke-width="1.4"/>
</svg>
