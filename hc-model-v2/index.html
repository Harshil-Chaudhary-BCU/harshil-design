<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harshil.design</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/hc-favicon-transparent-32-v2.png">
<link rel="shortcut icon" type="image/png" href="../assets/hc-favicon-transparent-32-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/hc-touch-transparent-180-v2.png">
<link rel="stylesheet" href="../cursor.css?v=black-titanium-rounded-small-2">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
#hc-logo{width:100%;height:100%;background:transparent}
#load-error{position:absolute;inset:45% 20px auto;text-align:center;font:14px system-ui;color:#be380b}
</style>
</head>
<body>
<div id="hc-logo"></div><div id="load-error" hidden role="alert"></div>
<script type="module">
import {mountHCLogo} from './hc-logo.js?v=slow1';
try { window.hcLogo=await mountHCLogo(document.getElementById('hc-logo')); }
catch(error){const status=document.getElementById('load-error');status.hidden=false;status.textContent='The HC model could not load. Serve this folder through your website or a local HTTP server.';console.error(error);}
</script>
<script src="../cursor.js?v=black-titanium-rounded-small-2"></script>
</body>
</html>
